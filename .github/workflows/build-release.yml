name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build release packages
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Build standalone linux binaries
        run: |
          mkdir -p release/bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -tags frpc -o release/bin/frpc_linux_amd64 ./cmd/frpc
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -tags frps -o release/bin/frps_linux_amd64 ./cmd/frps

      - name: Upload release packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: frp-packages
          path: |
            release/packages/
            release/bin/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/packages/**
            release/bin/**
          body_path: Release.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
